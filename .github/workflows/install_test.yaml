name: Install and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Test installed package
        shell: bash # to force Windows to use Bash instead of PowerShell
        working-directory: ${{ runner.temp }}
        run: python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v

  documentation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r docs/requirements.txt
          python -m pip check
      - name: Build and test documentation
        run: |
          python -m sphinx -E -a -b html -W --keep-going docs docs/_build/html
          python -m sphinx -E -a -b doctest -W --keep-going docs docs/_build/doctest
